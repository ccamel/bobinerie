name: Lint / Nix

on:
  workflow_call:

  push:
    branches: [main]
    paths:
      - .github/workflows/lint-nix.yml
      - flake.lock
      - flake.nix
      - '**/*.nix'

  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lint-nix.yml
      - flake.lock
      - flake.nix
      - '**/*.nix'

permissions:
  contents: read

concurrency:
  group: check-nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-nix:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check flake
        shell: bash
        run: |
          set -o pipefail

          nix flake check \
            --all-systems \
            --show-trace \
            --print-build-logs \
            2>&1 | tee /tmp/nix-flake-check.log

      - name: Reject Nix warnings
        shell: bash
        run: |
          if grep -Ei '(^|[^[:alpha:]])warning:' /tmp/nix-flake-check.log; then
            echo "::error::Nix emitted one or more warnings"
            exit 1
          fi

      - name: Check formatting
        shell: bash
        run: |
          mapfile -t nix_files < <(git ls-files '*.nix')
          nix run nixpkgs#nixfmt -- --check "${nix_files[@]}"

      - name: Statix
        shell: bash
        run: nix run nixpkgs#statix -- check .

      - name: Deadnix
        shell: bash
        run: nix run nixpkgs#deadnix -- --fail .
