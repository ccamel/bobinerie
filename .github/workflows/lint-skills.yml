name: Lint Agent Skills

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "skills/**"
  pull_request:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "skills/**"

concurrency:
  group: lint-skills-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-skills:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        source:
          - .agents/skills
          - skills
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4

      - name: Install skills-ref tool
        run: |
          uv tool install git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref

      - name: Validate skills with skills-ref
        run: |
          for dir in ${{ matrix.source }}/*/ ; do
            skills-ref validate "$dir"
          done

      - name: Validate skills with skill-check
        run: npx skill-check check --no-security-scan ${{ matrix.source }}
