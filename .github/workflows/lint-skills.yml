name: Lint Agent Skills

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "skills/**"
  pull_request:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "skills/**"

concurrency:
  group: lint-skills-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-skills:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        source:
          - .agents/skills
          - skills
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4

      - name: Install skills-ref tool
        run: |
          uv tool install git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref

      - name: Validate skills with skills-ref
        run: |
          for dir in ${{ matrix.source }}/*/ ; do
            skills-ref validate "$dir"
          done

      - name: Validate skills with skill-check
        run: npx skill-check check --no-security-scan ${{ matrix.source }}
