name: Lint Agent Skills

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "skills/**"
  pull_request:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "skills/**"

concurrency:
  group: lint-skills-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-skills:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        source:
          - .agents/skills
          - skills
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4

      - name: Install skills-ref tool
        run: |
          uv tool install git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref

      - name: Validate skills with skills-ref
        run: |
          for dir in ${{ matrix.source }}/*/ ; do
            skills-ref validate "$dir"
          done

      - name: Validate skills with skill-check
        run: npx skill-check check --no-security-scan ${{ matrix.source }}
